# What to get pinged about. GitHub's web/mobile editor works fine for this; the poller
# picks up changes on its next run.
#
# Target details (domain, endpoint, tab ids, venue labels) do NOT belong here - they live
# in the runtime site profile. See site.example.yaml.

poll:
  # Tab keys as defined in your site profile's `tabs:` section. Each is one extra
  # request per poll.
  #
  # `w50th` was dropped on 2026-08-26: the tab now returns a well-formed table with zero
  # rows, so that series has ended rather than the parser having broken. Re-add it here
  # if the Friday W50th sessions are listed again - the profile still defines the tab.
  tabs: [primary, beacon]

  # All window times below are in this zone, evaluated with real DST rules.
  timezone: America/New_York

  # Don't re-announce the same slot inside this window if it flaps full <-> open.
  cooldown_hours: 6
  # Scraper-health warnings are rate-limited harder so a persistent break can't spam.
  health_cooldown_hours: 12

  # Consecutive fetch failures before you're told the scraper may be down.
  failure_threshold: 3
  # Random 0..N seconds added to each sleep so requests aren't perfectly periodic.
  # Additive, so it only ever slows the cadence - at the 1-minute Friday interval a
  # 0-20s spread cost about 12% of the day's polls, and `expected_polls` does not model
  # it, so the loss showed up as a lower coverage figure in the closing report. Halved
  # to 10s on 2026-08-26: still aperiodic, ~93% of target rather than ~88%.
  jitter_seconds: 10

  # Weekdays only. This is a deliberate trade: cancellations must be submitted by 3pm
  # Friday to earn a refund, so nearly all of them land inside Mon-Fri. A spot freed on
  # Saturday or Sunday morning will not be noticed until Monday - by which point a
  # weekend session has already happened. Add `sat`/`sun` days below if you'd rather
  # catch those too.
  # Opens at 10:00 rather than 09:00: the first hour bought little, and a narrower window
  # is cheaper to cover completely than a wider one covered half the time.
  windows:
    - days: [mon, tue, wed, thu]
      start: "10:00"
      end: "17:00"
      interval_minutes: 3

    - days: [fri]
      start: "10:00"
      end: "17:00"
      interval_minutes: 3
      # The refund cutoff itself: cancellations cluster right before it.
      dense:
        start: "12:00"
        end: "15:00"
        interval_minutes: 1

notify:
  # The webhook URL is read from this environment variable, never stored here.
  webhook_url_env: DISCORD_WEBHOOK_URL
  # Your Discord user ID, so alerts actually buzz your phone rather than sitting
  # unread in a channel. Supplied via the environment; see README.
  mention_env: DISCORD_MENTION

  # Display name shown on each message. Without this, Discord falls back to whatever
  # the webhook itself was named - often a leftover from an unrelated integration.
  username: slotwatch
  # avatar_url: "https://example.com/icon.png"   # optional

  # One ping as the polling day opens, one as it closes. Neither mentions you: a phone
  # buzzing twice a day for routine news gets the channel muted, and a muted channel is
  # how the real alert gets missed. The closing ping reports polls made against polls
  # scheduled, which is the only thing that distinguishes "nothing opened up today"
  # from "the watcher was barely running today".
  daily_summary: true
  # ...with one exception. A day that lands under this share of its scheduled polls
  # *does* mention you, because that is a day where silence proves nothing.
  coverage_floor_percent: 75

# Rules scope by `tab:` rather than by venue name. The venue strings differ in
# formatting between tabs, so matching them is a silent-failure trap.
rules:
  # Brandeis Sunday, Court 1, the 4pm block - the only Sunday slot of interest.
  #   reopened -> a cancellation frees this exact slot
  #   new_slot -> a new Sunday date has dropped. All levels for a date are released at
  #               once, so this narrow rule still detects the whole drop; no broad
  #               catch-all rule is needed.
  - name: "Sunday Court 1, late block"
    enabled: true
    tab: primary
    level: "Intermediate - Court 1"
    time: "4:00 pm - 7:30 pm"
    date: any
    triggers: [new_slot, reopened]

  # Beacon Advanced is sold out on every currently listed date, so a cancellation is the
  # only way in. `reopened` only, deliberately: the "New Beacon date" rule that used to
  # sit here and announce every fresh date was removed on 2026-08-26, when the next drop
  # was known to be about a month out - the listing already runs to 2026-10-30, so there
  # is nothing for a `new_slot` rule to catch until then. Add `new_slot` here when that
  # changes, to hear about a new Advanced date without the other levels coming with it.
  # Exact match, so this is the "Advanced" level alone - "Advanced Intermediate" is a
  # separate level and mostly has room already. To watch both, set `match: regex`.
  - name: "Beacon Advanced reopening"
    enabled: true
    tab: beacon
    level: "Advanced"
    date: any
    triggers: [reopened]

  # --- Not enabled: wider Sunday coverage -------------------------------------------
  # Court 1 at 4pm is full on every currently listed date, so the rules above may stay
  # silent for a while. Uncomment to also hear about Court 2 and the midday block.
  # - name: "Any Sunday Intermediate opening"
  #   enabled: true
  #   tab: primary
  #   level: "Intermediate - Court [12]"
  #   match: regex
  #   date: any
  #   triggers: [new_slot, reopened]
