name: Poll booking slots

# Cron only *starts* these jobs; it does not set the polling cadence. GitHub's
# scheduled workflows are throttled, drift 5-15 minutes routinely, and get dropped
# under load, so a "*/3" schedule would yield erratic 10-20 minute resolution. Each
# job instead paces itself internally (see --loop), turning unreliable scheduling into
# a reliable 3-minute cadence.
#
# The five UTC start times below span the 9am-5pm Eastern window in BOTH DST states
# (13:00-21:00 UTC in EDT, 14:00-22:00 UTC in EST). The real boundary is enforced in
# Python via zoneinfo, so nothing silently shifts in November - see config.interval_at.
#
# Wall clock is ~10h/day, which is free only because Actions minutes are unlimited on
# public repositories. On a private repo, drop --loop and switch to a short "*/5" cron
# instead (~960 min/month), accepting 10-20 minute latency from cron drift.

on:
  schedule:
    # Weekdays only (1-5 = Mon-Fri), matching the windows in rules.yaml. The Python
    # window gate is still the authority; these just avoid starting jobs that would
    # immediately find nothing to do. Note cron's day-of-week is evaluated in UTC, so a
    # job started late Friday UTC is still Friday in Eastern time.
    - cron: "55 12 * * 1-5"
    - cron: "55 14 * * 1-5"
    - cron: "55 16 * * 1-5"
    - cron: "55 18 * * 1-5"
    - cron: "55 20 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Parse and report without posting to Discord"
        type: boolean
        default: false
      ignore_window:
        description: "Poll even outside the configured time windows"
        type: boolean
        default: false

concurrency:
  # Never two writers to state/seen.json. Queue rather than cancel, so a run that is
  # mid-poll is allowed to persist what it already found.
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 135 # just above --max-runtime so a wedged job can't run away

    steps:
      - uses: actions/checkout@v4
        with:
          # The branch tip, not github.sha. A scheduled run pins github.sha when the run
          # is *created*; a run that then waits behind the concurrency lock starts with
          # a SHA that is minutes or hours stale, so the default checkout can miss state
          # a previous run already pushed. That is precisely how run 30301348989 created
          # state/seen.json a second time and died on an add/add conflict five seconds
          # after the previous run pushed the same file.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Poll
        env:
          # Target details live in a secret, so the public repo never names the site.
          SITE_PROFILE: ${{ secrets.SITE_PROFILE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
        run: |
          python -m slotwatch.main --loop --max-runtime 115 \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.ignore_window && '--ignore-window' || '' }}

      - name: Persist state
        # Runs even if the poll step failed, so a crash mid-window doesn't discard
        # detections already written to disk.
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "state unchanged; nothing to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Our freshly-polled state, parked outside the tree so rewinding onto the
          # remote tip below cannot lose it. Absent only if the poll step died before
          # its first save, in which case there is nothing of ours to protect.
          mine="${RUNNER_TEMP}/mine.json"
          theirs="${RUNNER_TEMP}/theirs.json"
          rm -f "$mine" "$theirs"
          if [ -f state/seen.json ]; then
            cp state/seen.json "$mine"
          fi

          # Another run may still have pushed while this one polled - the checkout ref
          # above closes the common case, not a genuine overlap.
          for attempt in 1 2 3; do
            git add state/
            git diff --cached --quiet || git commit -m "chore: slot watcher state [skip ci]"
            if git push origin "HEAD:${BRANCH}"; then
              echo "state pushed on attempt ${attempt}"
              exit 0
            fi

            echo "push rejected; merging the remote's state (attempt ${attempt})"
            git fetch origin "${BRANCH}"

            # NOT a rebase. seen.json is a set of observations: two runs that each
            # create it conflict add/add, and a line-wise merge of JSON is meaningless.
            # Taking one side would drop either a sighting or a notified-marker, and a
            # lost marker re-pings a slot you were already told about. Rewind onto the
            # remote tip, compute the union in Python, and commit that as an ordinary
            # fast-forward instead.
            git show "origin/${BRANCH}:state/seen.json" > "$theirs" 2>/dev/null || rm -f "$theirs"
            git reset --hard "origin/${BRANCH}"
            if [ -f "$mine" ]; then
              cp "$mine" state/seen.json
              if [ -f "$theirs" ]; then
                python -m slotwatch.main --state state/seen.json --merge-state "$theirs"
              fi
              cp state/seen.json "$mine"
            fi

            if [ -z "$(git status --porcelain state/)" ]; then
              echo "remote state already covers this run; nothing to push"
              exit 0
            fi
          done

          echo "could not push state after 3 attempts" >&2
          exit 1
