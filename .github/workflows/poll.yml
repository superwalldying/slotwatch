name: Poll booking slots

# Cron only *offers* these jobs; it does not set the polling cadence, and it cannot be
# trusted to set the start time either. Each job paces itself internally (--loop), which
# is what turns unreliable scheduling into a reliable 3-minute cadence.
#
# How late is "late"? Measured over ten consecutive real starts on this repo, GitHub's
# scheduled-event dispatcher ran 3h14m to 5h06m behind cron, never once under three
# hours; the weekly heartbeat came in 6h05m late. None of that is queueing - every run
# had run_started_at == created_at and picked up a runner in under ten seconds, so the
# whole delay is GitHub declining to emit the event. Push-triggered workflows in this
# same repo start in about three seconds.
#
# Five crons pinned near the window therefore covered only 37-50% of it: the first job
# of the day did not arrive until early afternoon, and the last two landed after the
# window had shut and no-oped. So instead: offer a job every hour across the entire band
# in which a 3-6 hour delay can still land usefully. Whichever arrives first starts the
# chain, `concurrency: poll` serialises the rest into a back-to-back handover, and any
# that arrive outside the window cost about twenty seconds each.
#
# Simulated against the measured delay, this holds 100% coverage in both DST states, and
# still returns 85%+ if the delay were to double. Raising --max-runtime alone would have
# moved coverage 44% -> 49%: spreading the crons is the part that matters, and the longer
# budget only closes the worst case.
#
# Wall clock is ~7-11h/day, free only because Actions minutes are unlimited on public
# repositories. On a private repo, drop --loop for a short "*/5" cron (~960 min/month)
# and accept the latency.

on:
  schedule:
    # Hourly 05:07-19:07 UTC, weekdays only (1-5 = Mon-Fri). The band covers the
    # 10:00-17:00 Eastern window in BOTH DST states (14:00-21:00 UTC under EDT,
    # 15:00-22:00 under EST); the real boundary is enforced in Python via zoneinfo, so
    # nothing silently shifts in November - see config.interval_at.
    #
    # Minute :07 rather than :00 or :55 because GitHub's own guidance is that the
    # scheduling queue is deepest at round times.
    #
    # Note cron's day-of-week is evaluated in UTC, so a job offered late Friday UTC is
    # still Friday in Eastern time.
    - cron: "7 5-19 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Parse and report without posting to Discord"
        type: boolean
        default: false
      ignore_window:
        description: "Poll even outside the configured time windows"
        type: boolean
        default: false

concurrency:
  # Never two writers to state/seen.json. Queue rather than cancel, so a run that is
  # mid-poll is allowed to persist what it already found.
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 345 # just above --max-runtime so a wedged job can't run away

    steps:
      - uses: actions/checkout@v4
        with:
          # The branch tip, not github.sha. A scheduled run pins github.sha when the run
          # is *created*; a run that then waits behind the concurrency lock starts with
          # a SHA that is minutes or hours stale, so the default checkout can miss state
          # a previous run already pushed. That is precisely how run 30301348989 created
          # state/seen.json a second time and died on an add/add conflict five seconds
          # after the previous run pushed the same file.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Poll
        env:
          # Target details live in a secret, so the public repo never names the site.
          SITE_PROFILE: ${{ secrets.SITE_PROFILE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
        run: |
          # 330 min, against a 7h window: two jobs chained cover the day with slack, and
          # a job that arrives before the window opens can wait it out rather than
          # exiting - see the sleep-until-next_open path in main.run.
          python -m slotwatch.main --loop --max-runtime 330 \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.ignore_window && '--ignore-window' || '' }}

      - name: Persist state
        # Runs even if the poll step failed, so a crash mid-window doesn't discard
        # detections already written to disk.
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "state unchanged; nothing to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Our freshly-polled state, parked outside the tree so rewinding onto the
          # remote tip below cannot lose it. Absent only if the poll step died before
          # its first save, in which case there is nothing of ours to protect.
          mine="${RUNNER_TEMP}/mine.json"
          theirs="${RUNNER_TEMP}/theirs.json"
          rm -f "$mine" "$theirs"
          if [ -f state/seen.json ]; then
            cp state/seen.json "$mine"
          fi

          # Another run may still have pushed while this one polled - the checkout ref
          # above closes the common case, not a genuine overlap.
          for attempt in 1 2 3; do
            git add state/
            git diff --cached --quiet || git commit -m "chore: slot watcher state [skip ci]"
            if git push origin "HEAD:${BRANCH}"; then
              echo "state pushed on attempt ${attempt}"
              exit 0
            fi

            echo "push rejected; merging the remote's state (attempt ${attempt})"
            git fetch origin "${BRANCH}"

            # NOT a rebase. seen.json is a set of observations: two runs that each
            # create it conflict add/add, and a line-wise merge of JSON is meaningless.
            # Taking one side would drop either a sighting or a notified-marker, and a
            # lost marker re-pings a slot you were already told about. Rewind onto the
            # remote tip, compute the union in Python, and commit that as an ordinary
            # fast-forward instead.
            git show "origin/${BRANCH}:state/seen.json" > "$theirs" 2>/dev/null || rm -f "$theirs"
            git reset --hard "origin/${BRANCH}"
            if [ -f "$mine" ]; then
              cp "$mine" state/seen.json
              if [ -f "$theirs" ]; then
                python -m slotwatch.main --state state/seen.json --merge-state "$theirs"
              fi
              cp state/seen.json "$mine"
            fi

            if [ -z "$(git status --porcelain state/)" ]; then
              echo "remote state already covers this run; nothing to push"
              exit 0
            fi
          done

          echo "could not push state after 3 attempts" >&2
          exit 1
