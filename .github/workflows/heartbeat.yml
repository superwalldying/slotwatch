name: Heartbeat

# GitHub disables scheduled workflows after 60 days without repository activity, and
# "no slots changed for two months" is an entirely plausible quiet stretch for this
# bot. Losing the schedule would look exactly like "no slots have opened" - the silent
# failure this project is built to avoid. A weekly commit keeps the repo active.
#
# It also doubles as a liveness canary: if you stop seeing heartbeat commits, Actions
# has stopped running and the poller is not watching either.

on:
  schedule:
    - cron: "17 11 * * 1" # Mondays
  workflow_dispatch:

concurrency:
  group: poll # share the poller's lock; both write to state/
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch tip, not the SHA pinned when the run was created - this job shares
          # the poller's concurrency lock and can sit behind a two-hour poll. See the
          # longer note in poll.yml.
          ref: ${{ github.ref_name }}

      - name: Touch heartbeat
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # No merge needed, unlike state/seen.json: this file is a single timestamp, so
          # a rewind onto the remote tip and a fresh `date` is the whole reconciliation.
          for attempt in 1 2 3; do
            date -u +"%Y-%m-%dT%H:%M:%SZ" > state/heartbeat.txt
            git add state/heartbeat.txt
            git diff --cached --quiet || git commit -m "chore: heartbeat [skip ci]"
            if git push origin "HEAD:${BRANCH}"; then
              echo "heartbeat pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected; rebuilding on the remote tip (attempt ${attempt})"
            git fetch origin "${BRANCH}"
            git reset --hard "origin/${BRANCH}"
          done

          echo "could not push heartbeat after 3 attempts" >&2
          exit 1
