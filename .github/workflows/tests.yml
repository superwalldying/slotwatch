name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        # Fully offline. The `live` marker is excluded by default in pyproject.toml.
        run: pytest -q

      - name: Fixtures still regenerate identically
        # Catches a variant fixture being hand-edited out of sync with its generator.
        run: |
          python tests/fixtures/make_variants.py
          if [ -n "$(git status --porcelain tests/fixtures/)" ]; then
            echo "Derived fixtures differ from make_variants.py output:" >&2
            git --no-pager diff --stat tests/fixtures/ >&2
            exit 1
          fi
